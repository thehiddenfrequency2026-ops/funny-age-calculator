name: Build Android APK and iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: |
          cp -r lib /tmp/lib_bak
          cp -r test /tmp/test_bak
          flutter create --platforms=android,ios --project-name funny_age_calculator --org com.funnyage .
          rm -rf lib test
          cp -r /tmp/lib_bak lib
          cp -r /tmp/test_bak test

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk FunnyAgeCalculator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: FunnyAgeCalculator.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: |
          cp -r lib /tmp/lib_bak
          cp -r test /tmp/test_bak
          flutter create --platforms=android,ios --project-name funny_age_calculator --org com.funnyage .
          rm -rf lib test
          cp -r /tmp/lib_bak lib
          cp -r /tmp/test_bak test

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr FunnyAgeCalculator-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: FunnyAgeCalculator-unsigned.ipa
